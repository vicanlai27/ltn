{# Pagination — expects: pagination (Flask-SQLAlchemy Pagination object), endpoint, kwargs #}
{% if pagination.pages > 1 %}
<nav class="pagination" aria-label="Pagination">
    {% if pagination.has_prev %}
        <a href="{{ url_for(endpoint, page=pagination.prev_num, **kwargs) }}" class="pagination__btn" aria-label="Previous page">← Prev</a>
    {% endif %}

    <span class="pagination__info">Page {{ pagination.page }} of {{ pagination.pages }}</span>

    {% if pagination.has_next %}
        <a href="{{ url_for(endpoint, page=pagination.next_num, **kwargs) }}" class="pagination__btn" aria-label="Next page">Next →</a>
    {% endif %}
</nav>

<style>
    .pagination {
        display: flex; align-items: center; justify-content: center;
        gap: 16px; margin: 32px 0;
    }
    .pagination__btn {
        padding: 8px 16px; border-radius: var(--radius);
        background: var(--surface); color: var(--text);
        border: 1px solid var(--border); font-weight: 500;
        font-size: 14px;
    }
    .pagination__btn:hover { background: var(--brand-primary); color: white; border-color: var(--brand-primary); text-decoration: none; }
    .pagination__info { color: var(--muted); font-size: 14px; }
</style>
{% endif %}
